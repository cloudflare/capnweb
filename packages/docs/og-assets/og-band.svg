<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
     width="1200" height="630">
<defs>
<linearGradient id="oband" gradientUnits="userSpaceOnUse"
                x1="-38.8" y1="155.7" x2="1238.8" y2="474.3">
<stop offset="0" stop-color="rgb(35 87 167)" stop-opacity="0.12"/>
<stop offset="0.54" stop-color="rgb(40 99 155)" stop-opacity="0.31"/>
<stop offset="1" stop-color="rgb(0 255 221)" stop-opacity="0.16"/>
</linearGradient>
<radialGradient id="oglow1" gradientUnits="userSpaceOnUse" cx="144" cy="0" r="864"
                gradientTransform="translate(144 0) scale(1 0.9) translate(-144 0)">
<stop offset="0" stop-color="#004dff" stop-opacity="0.129"/>
<stop offset="0.62" stop-color="#004dff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="oglow2" gradientUnits="userSpaceOnUse" cx="1080" cy="655.2" r="792"
                gradientTransform="translate(1080 655.2) scale(1 0.9) translate(-1080 -655.2)">
<stop offset="0" stop-color="#41d2a0" stop-opacity="0.122"/>
<stop offset="0.6" stop-color="#41d2a0" stop-opacity="0"/>
</radialGradient>
</defs>
<!-- The card needs an opaque base under the translucent band. It is the site's
     own dark page colour, so the card looks like the site in dark mode. -->
<rect width="1200" height="630" fill="#070a11"/>
<rect width="1200" height="630" fill="url(#oband)"/>
<rect width="1200" height="630" fill="url(#oglow1)"/>
<rect width="1200" height="630" fill="url(#oglow2)"/>
<rect width="12" height="630" fill="#f6821f"/>
</svg>
