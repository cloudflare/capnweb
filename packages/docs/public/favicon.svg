<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Three nodes and the edges between them: the smallest thing that still reads
    as a network at 16px. The originating node is Cloudflare orange, the rest of
    the graph deep azure -- the same one-spark-on-blue rule the site uses.
  -->
  <rect width="32" height="32" rx="7" fill="#04070e"/>
  <g stroke="#1487e0" stroke-width="1.75" stroke-linecap="round" opacity=".9">
    <path d="M10 9.5 22 16"/>
    <path d="M10 9.5v13"/>
    <path d="M10 22.5 22 16"/>
  </g>
  <circle cx="22" cy="16" r="3.1" fill="#38a5f5"/>
  <circle cx="10" cy="22.5" r="3.1" fill="#38a5f5"/>
  <circle cx="10" cy="9.5" r="3.6" fill="#f6821f"/>
</svg>
