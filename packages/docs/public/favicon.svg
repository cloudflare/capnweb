<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A quiet cool-grey mark: two waves and a tomato spark.

    Keep the two-hyphen sequence out of this comment. XML forbids it inside a
    comment, and an SVG that fails to parse is an image the browser silently
    declines to draw, which is a genuinely difficult bug to see.
  -->
  <rect width="32" height="32" rx="7" fill="#eef1f4"/>
  <path d="M6 20c3-4 6-4 10 0s7 4 10 0" fill="none" stroke="#6a7c8f" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 13c3-4 6-4 10 0s7 4 10 0" fill="none" stroke="#9aa8b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="10" r="2.4" fill="#e85d2c"/>
</svg>
